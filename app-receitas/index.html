<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // aplica o tema salvo (ou o do sistema) antes da primeira renderização, evitando "flash"
      try {
        var saved = localStorage.getItem("app-receitas.theme");
        document.documentElement.dataset.theme =
          saved ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <title>app-receitas</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
